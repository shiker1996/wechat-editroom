<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">见字编辑工作台横幅</title>
  <desc id="desc">深蓝灰背景与朱红印章，搭配从信息采集到文章交付的编辑流程图形。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d38"/>
      <stop offset="1" stop-color="#293b47"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fffaf2" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="24" fill="url(#grid)"/>
  <circle cx="1475" cy="-35" r="250" fill="#aa5b55" opacity=".12"/>
  <circle cx="1510" cy="435" r="190" fill="#d9b887" opacity=".08"/>

  <g transform="translate(108 82)">
    <rect width="272" height="272" rx="12" fill="#aa5b55"/>
    <rect x="16" y="16" width="240" height="240" rx="5" fill="none" stroke="#fffaf2" stroke-opacity=".45" stroke-width="2"/>
    <text x="136" y="202" text-anchor="middle" fill="#fffaf2" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="166" font-weight="700">见</text>
    <path d="M34 34h26M34 34v26M238 34h-26M238 34v26M34 238h26M34 238v-26M238 238h-26M238 238v-26" fill="none" stroke="#fffaf2" stroke-opacity=".55" stroke-width="3"/>
  </g>

  <g fill="#fffaf2">
    <text x="444" y="155" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" letter-spacing="8" fill="#d9b887">LOCAL-FIRST EDITORIAL WORKBENCH</text>
    <text x="438" y="260" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="82" font-weight="700">见字</text>
    <text x="444" y="316" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" fill="#fffaf2" fill-opacity=".78">让每一次选题、判断与成稿，都有迹可循。</text>
    <path d="M444 353H935" stroke="#fffaf2" stroke-opacity=".2" stroke-width="2"/>
    <text x="444" y="390" font-family="Arial, sans-serif" font-size="18" letter-spacing="3" fill="#fffaf2" fill-opacity=".55">SIGNALS  ·  EDITORIAL JUDGMENT  ·  PUBLISHABLE WORK</text>
  </g>

  <g transform="translate(1015 119)" fill="none" stroke="#fffaf2" stroke-width="2">
    <path d="M146 180h28m-8-8 8 8-8 8M326 180h28m-8-8 8 8-8 8" stroke="#d9b887" stroke-opacity=".82"/>
    <g fill="#293b47" stroke="#fffaf2" stroke-opacity=".62">
      <rect x="0" y="146" width="146" height="68" rx="10"/>
      <rect x="180" y="146" width="146" height="68" rx="10"/>
      <rect x="360" y="146" width="146" height="68" rx="10"/>
    </g>
    <g fill="#fffaf2" stroke="none" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" text-anchor="middle">
      <text x="73" y="188">采集 · 研判</text>
      <text x="253" y="188">选题 · 写作</text>
      <text x="433" y="188">审稿 · 交付</text>
    </g>
    <circle cx="20" cy="164" r="4" fill="#d9b887" stroke="none"/>
    <circle cx="200" cy="164" r="4" fill="#d9b887" stroke="none"/>
    <circle cx="380" cy="164" r="4" fill="#d9b887" stroke="none"/>
  </g>
</svg>
