<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380" role="img" aria-labelledby="title desc">
  <title id="title">见字工作台上手指南</title>
  <desc id="desc">安装工作台，准备采集源，完成第一篇文章。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192735"/><stop offset="1" stop-color="#344956"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fffaf2" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1600" height="380" rx="22" fill="url(#grid)"/>
  <circle cx="1510" cy="-25" r="230" fill="#d86d37" opacity=".13"/>
  <g transform="translate(72 84)">
    <rect width="210" height="210" rx="12" fill="#a6534d"/>
    <rect x="12" y="12" width="186" height="186" rx="5" fill="none" stroke="#fffaf2" stroke-opacity=".5" stroke-width="2"/>
    <text x="105" y="156" text-anchor="middle" fill="#fffaf2" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="132" font-weight="700">见</text>
  </g>
  <g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">
    <text x="340" y="105" fill="#dfbd8f" font-size="18" letter-spacing="5">从第一次启动开始</text>
    <text x="336" y="190" fill="#fffaf2" font-size="54" font-weight="700">完成第一篇内容交付</text>
    <text x="340" y="239" fill="#fffaf2" fill-opacity=".78" font-size="22">安装工作台、连接模型、准备来源，再从选题写到成稿。</text>
    <text x="340" y="295" fill="#b8d8c8" font-size="16">Windows 桌面版无需单独安装 Node.js　·　RSSHub 等可选能力按需启用</text>
  </g>
  <g transform="translate(1040 134)" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" text-anchor="middle">
    <g fill="#263947" stroke="#fffaf2" stroke-opacity=".32">
      <rect x="0" y="18" width="145" height="92" rx="10"/><rect x="184" y="18" width="145" height="92" rx="10"/><rect x="368" y="18" width="145" height="92" rx="10"/>
    </g>
    <path d="M150 64h26m-8-8 8 8-8 8M334 64h26m-8-8 8 8-8 8" fill="none" stroke="#dfbd8f" stroke-width="2"/>
    <g fill="#fffaf2" font-size="17"><text x="72" y="58">安装</text><text x="72" y="84" fill="#b8d8c8" font-size="12">桌面版 / 源码版</text><text x="256" y="58">准备</text><text x="256" y="84" fill="#b8d8c8" font-size="12">账号 / 信息源</text><text x="440" y="58">交付</text><text x="440" y="84" fill="#b8d8c8" font-size="12">文章 / 图文</text></g>
  </g>
