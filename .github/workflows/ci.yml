name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      E2E_ARTIFACT_DIR: test-results/e2e
      PUPPETEER_LAUNCH_TIMEOUT_MS: 60000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 缓存 Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json', 'skills/**/package.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: 安装依赖（含技能级联）
        run: npm ci

      - name: 准备 JUnit 报告目录
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path test-results/junit | Out-Null

      - name: 生成样式 bundle
        run: npm run build:styles

      - name: 构建校验
        run: npm run build

      - name: 颜色硬编码与变量校验
        run: npm run check:page-colors

      - name: 颜色用途混用基线
        run: npm run audit:color-roles -- --strict

      - name: 主链路 E2E 门禁
        run: node --disable-warning=ExperimentalWarning --test --test-concurrency=2 --test-reporter=tap --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/junit/e2e.xml test/e2e/**/*.test.mjs

      - name: 单元与集成测试
        run: node --disable-warning=ExperimentalWarning --test --test-reporter=tap --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/junit/unit.xml test/*.test.mjs
        # 覆盖浏览器渲染层（布局审计、ECharts、浏览器内联化），Chromium 来自 postinstall 下载，
        # 不依赖真实 API Key、用户 Chrome Profile、RSSHub 常驻进程或外部 CDN 写入。

      - name: 发布 JUnit 测试报告
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: test-results/junit/*.xml
          check_name: Node.js test report
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: 消费者—能力治理门禁
        run: npm run capability:gates

      - name: 校验示例技能包与工具插件
        run: |
          node scripts/quality/validate-skill-package.mjs docs/examples/skill-package
          node scripts/quality/validate-tool-plugin.mjs docs/examples/tool-plugin

      - name: 依赖漏洞扫描
        run: npm audit --audit-level=high --omit=dev

      - name: 许可证扫描
        run: node scripts/quality/license-scan.mjs

      - name: 秘密扫描
        run: node scripts/quality/secret-scan.mjs

      - name: 上传 E2E 诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 14
