name: Build Windows desktop release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_RUNTIME_VERSION: "24.12.0"
  RSSHUB_REVISION: "49b3eb74531c6312e9eb11f8244e82ed0532de28"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "pr_template": "- #{{TITLE}} ([#{{NUMBER}}](#{{URL}}))",
              "transformers": [
                {
                  "pattern": "^(\\s*-\\s*)(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|test|style)(?:\\([^)]*\\))?:\\s*",
                  "target": "$1",
                  "flags": "i"
                }
              ],
              "categories": [
                { "title": "## ✨ Features", "labels": ["enhancement"] },
                { "title": "## 🐛 Bug fixes", "labels": ["bug"] },
                { "title": "## 📚 Documentation", "labels": ["documentation"] },
                { "title": "## 📦 Dependencies", "labels": ["dependencies"] },
                { "title": "## ⚙️ CI and maintenance", "labels": ["github_actions"] },
                { "title": "## 🔧 Other changes", "labels": [] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Stamp project and DSH plugin versions from release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/prepare-release-version.mjs "$env:RELEASE_TAG"

      - name: Install production and build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install screenshot skill dependencies
        run: npm install --prefix skills/html-pages-to-images --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build source and DSH plugin release packages
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run release

      - name: Prepare bundled Node.js runtime
        shell: pwsh
        run: |
          $name = "node-v$env:NODE_RUNTIME_VERSION-win-x64"
          $runtimeParent = Join-Path $env:GITHUB_WORKSPACE ".node-runtime"
          $runtimeDir = Join-Path $runtimeParent "node-v$env:NODE_RUNTIME_VERSION"
          $temp = Join-Path $env:RUNNER_TEMP "jianzhi-node-runtime"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $zip = Join-Path $temp "$name.zip"
          $sums = Join-Path $temp "SHASUMS256.txt"
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION/$name.zip" -OutFile $zip
          Invoke-WebRequest "https://nodejs.org/dist/v$env:NODE_RUNTIME_VERSION/SHASUMS256.txt" -OutFile $sums
          $line = Get-Content $sums | Where-Object { $_ -match " $([regex]::Escape($name))\.zip$" } | Select-Object -First 1
          $expected = ($line -split "\s+")[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -and $expected -ne $actual) { throw "Node.js runtime checksum mismatch" }
          $extract = Join-Path $temp "extract"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          Remove-Item -LiteralPath $runtimeParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeParent | Out-Null
          Move-Item -LiteralPath (Join-Path $extract $name) -Destination $runtimeDir
          if (-not (Test-Path (Join-Path $runtimeDir "node.exe"))) { throw "Bundled Node.js runtime is incomplete" }

      - name: Prepare pinned RSSHub source
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "jianzhi-rsshub-source"
          $archive = Join-Path $temp "rsshub.zip"
          $extract = Join-Path $temp "extract"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Invoke-WebRequest "https://github.com/DIYgod/RSSHub/archive/$env:RSSHUB_REVISION.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $source = Get-ChildItem -LiteralPath $extract -Directory | Where-Object { (Test-Path (Join-Path $_.FullName "package.json")) -and (Test-Path (Join-Path $_.FullName "lib\index.ts")) } | Select-Object -First 1
          if (-not $source) { throw "Pinned RSSHub source is incomplete" }
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "RSSHub") -Recurse -Force -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $source.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE "RSSHub")

      - name: Build Windows installer
        run: npm run desktop:win

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist") -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          Write-Host "Built $($installer.FullName) ($($installer.Length) bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jianzhi-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/*.tgz
            dist/SHA256SUMS.txt

      - name: Create release automation token
        if: startsWith(github.ref, 'refs/tags/')
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request to sync release versions
        if: startsWith(github.ref, 'refs/tags/')
        id: version-sync-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          base: master
          branch: codex/release-version-${{ github.ref_name }}
          add-paths: |
            package.json
            package-lock.json
            agent-integrations/dsh-workbench/package.json
          commit-message: "chore(release): sync package versions to ${{ github.ref_name }}"
          title: "chore(release): sync package versions to ${{ github.ref_name }}"
          body: |
            Automated version sync after release tag `${{ github.ref_name }}`.

            Updates the application manifest, lockfile, and DSH plugin manifest to the released version.

      - name: Enable auto-merge after PR checks pass
        if: startsWith(github.ref, 'refs/tags/') && steps.version-sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.version-sync-pr.outputs.pull-request-number }}
        run: gh pr merge "$env:PR_NUMBER" --auto --squash
