name: Publish DSH plugin to npm

on:
  push:
    tags:
      - "dsh-plugin-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-dsh-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-integrations/dsh-workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="dsh-plugin-v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

      - name: Build plugin bundle
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Create npm package tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: jianzi-content-workbench-${{ github.ref_name }}
          path: agent-integrations/dsh-workbench/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Publish package tarball with npm Trusted Publishing
        run: npm publish ./artifacts/*.tgz
